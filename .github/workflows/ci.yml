name: OpenNDR Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend Python (FastAPI & PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: openndr_test
          POSTGRES_USER: openndr_test_user
          POSTGRES_PASSWORD: openndr_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11 (Debian 13 Default)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx psycopg2-binary
          pip install -e backend/
      - name: Run Ruff Linter
        run: ruff check backend/
      - name: Run Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://openndr_test_user:openndr_test_password@localhost:5432/openndr_test
          OPENNDR_ENV: development
        run: |
          cd backend
          alembic upgrade head
      - name: Run Automated Backend & Security Tests
        env:
          DATABASE_URL: postgresql+psycopg2://openndr_test_user:openndr_test_password@localhost:5432/openndr_test
          OPENNDR_ENV: development
          SECRET_KEY: test_secret_key_minimum_32_characters_for_ci_checks
        run: |
          PYTHONPATH=backend python -m pytest backend/tests -v

  frontend-checks:
    name: Frontend React (TypeScript & Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install npm dependencies
        run: npm ci
      - name: TypeScript / Lint Checks
        run: npm run lint
      - name: Vite Production Build
        run: npm run build

  rust-checks:
    name: Rust Network Engine (openndr-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cargo Format Check
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - name: Cargo Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings
      - name: Cargo Test
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Cargo Build Release
        run: cargo build --manifest-path engine/Cargo.toml --release

  installer-checks:
    name: Debian 13 Deployment Scripts Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Shell Syntax
        run: |
          bash -n deployment/debian/check-prerequisites.sh
          bash -n deployment/debian/install.sh
          bash -n deployment/debian/uninstall.sh
      - name: Run Prerequisites Check in Test Mode
        run: bash deployment/debian/check-prerequisites.sh
