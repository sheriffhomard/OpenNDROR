  />

  <!-- Inner Subtle Radar Rings -->
  <circle cx="256" cy="248" r="76" stroke="#10b981" stroke-opacity="0.22" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="248" r="44" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="3" />

  <!-- Telemetry Pulse Line -->
  <path
    d="M150 250H194L220 198L252 302L284 218L306 250H362"
