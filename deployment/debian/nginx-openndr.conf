# ==============================================================================
# OpenNDR V0.1 — Configuration Serveur Web Nginx pour Debian 13 (Trixie)
# Emplacement de destination : /etc/nginx/sites-available/openndr.conf
# Lien symbolique : /etc/nginx/sites-enabled/openndr.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Racine des fichiers statiques compilés par Vite
    root /opt/openndr/dist;
    index index.html;

    # En-têtes de sécurité recommandés
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:8000;" always;

    # Compression gzip pour les assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Reverse proxy vers l'API FastAPI Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
        proxy_connect_timeout 10;
        proxy_buffering off;
    }

    # Redirection SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Interdiction d'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logs dédiés OpenNDR
    access_log /var/log/nginx/openndr_access.log;
    error_log /var/log/nginx/openndr_error.log warn;
}
