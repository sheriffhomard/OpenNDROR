[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/capture",
]

[workspace.package]
version = "0.1.0"
authors = ["OpenNDR Engineering Team <engineering@openndr.local>"]
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/openndr/openndr"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
