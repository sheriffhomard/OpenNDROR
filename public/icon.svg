    </linearGradient>
  </defs>

  <!-- Rounded App Tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" stroke="#10b981" stroke-opacity="0.32" stroke-width="6" />

  <!-- Outer Shield -->
  <path
    d="M256 82L394 134V248C394 337 334 405 256 434C178 405 118 337 118 248V134L256 82Z"
