  />

  <!-- Network Nodes -->
  <circle cx="150" cy="250" r="10" fill="#38bdf8" />
  <circle cx="256" cy="128" r="9" fill="#34d399" />
  <circle cx="362" cy="250" r="10" fill="#34d399" />
  <circle cx="252" cy="302" r="8" fill="#ffffff" />
